name: oma-prod

services:
  app:
    image: ${OMA_IMAGE:?OMA_IMAGE is required}
    restart: unless-stopped
    ports:
      - '${OMA_PORT:-40197}:80'
    mem_limit: ${OMA_APP_MEM:-700m}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${OMA_APP_SECRET:?OMA_APP_SECRET is required}
      DATABASE_URL: mysql://sylius:${OMA_DB_PASSWORD:?OMA_DB_PASSWORD is required}@mysql:3306/sylius_oma?serverVersion=8.0&charset=utf8mb4
      DEFAULT_URI: ${OMA_DEFAULT_URI:?OMA_DEFAULT_URI is required}
      TRUSTED_PROXIES: ${OMA_TRUSTED_PROXIES:-}
      MAILER_DSN: ${OMA_MAILER_DSN:-null://null}
      JWT_PASSPHRASE: ${OMA_JWT_PASSPHRASE:?OMA_JWT_PASSPHRASE is required}
      GOOGLE_CLIENT_ID: ${OMA_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${OMA_GOOGLE_CLIENT_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${OMA_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${OMA_STRIPE_SECRET_KEY:-}
      MESSENGER_TRANSPORT_DSN: doctrine://default
      SYLIUS_MESSENGER_TRANSPORT_MAIN_DSN: doctrine://default
      SYLIUS_MESSENGER_TRANSPORT_MAIN_FAILED_DSN: doctrine://default?queue_name=main_failed
      SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_DSN: doctrine://default?queue_name=catalog_promotion_removal
      SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_FAILED_DSN: doctrine://default?queue_name=catalog_promotion_removal_failed
      FRANKENPHP_CONFIG: |
        num_threads ${OMA_PHP_THREADS:-4}
        worker /app/public/index.php ${OMA_PHP_WORKERS:-2}
    volumes:
      - media:/app/public/media
      - jwt:/app/config/jwt
      - var_log:/app/var/log
      - var_sessions:/app/var/sessions
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: ${OMA_DB_MEM:-380m}
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${OMA_DB_ROOT_PASSWORD:?OMA_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: sylius_oma
      MYSQL_USER: sylius
      MYSQL_PASSWORD: ${OMA_DB_PASSWORD:?OMA_DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-oma.cnf:/etc/mysql/conf.d/oma.cnf:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${OMA_DB_ROOT_PASSWORD}',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
  media:
  jwt:
  var_log:
  var_sessions:
