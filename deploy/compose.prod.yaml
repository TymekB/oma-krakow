name: oma-prod

x-app-env: &app-env
  APP_ENV: prod
  APP_DEBUG: 0
  APP_SECRET: ${OMA_APP_SECRET:?OMA_APP_SECRET is required}
  DATABASE_URL: mysql://sylius:${OMA_DB_PASSWORD:?OMA_DB_PASSWORD is required}@mysql:3306/sylius_oma?serverVersion=8.0&charset=utf8mb4
  DEFAULT_URI: ${OMA_DEFAULT_URI:?OMA_DEFAULT_URI is required}
  TRUSTED_PROXIES: ${OMA_TRUSTED_PROXIES:-}
  MAILER_DSN: ${OMA_MAILER_DSN:-smtp://mailpit:1025}
  JWT_PASSPHRASE: ${OMA_JWT_PASSPHRASE:?OMA_JWT_PASSPHRASE is required}
  GOOGLE_CLIENT_ID: ${OMA_GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${OMA_GOOGLE_CLIENT_SECRET:-}
  STRIPE_PUBLISHABLE_KEY: ${OMA_STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_SECRET_KEY: ${OMA_STRIPE_SECRET_KEY:-}
  PAYU_ENVIRONMENT: ${OMA_PAYU_ENVIRONMENT:-sandbox}
  PAYU_POS_ID: ${OMA_PAYU_POS_ID:-}
  PAYU_CLIENT_ID: ${OMA_PAYU_CLIENT_ID:-}
  PAYU_CLIENT_SECRET: ${OMA_PAYU_CLIENT_SECRET:-}
  PAYU_SIGNATURE_KEY: ${OMA_PAYU_SIGNATURE_KEY:-}
  APPLE_PAY_MERCHANT_ID: ${OMA_APPLE_PAY_MERCHANT_ID:-}
  APPLE_PAY_DISPLAY_NAME: ${OMA_APPLE_PAY_DISPLAY_NAME:-OMA Krakow}
  APPLE_PAY_PAYMENT_METHOD_CODE: ${OMA_APPLE_PAY_PAYMENT_METHOD_CODE:-payu_apple_pay}
  APPLE_PAY_CERT_PATH: ${OMA_APPLE_PAY_CERT_PATH:-}
  APPLE_PAY_CERT_KEY_PATH: ${OMA_APPLE_PAY_CERT_KEY_PATH:-}
  APPLE_PAY_CERT_PASSPHRASE: ${OMA_APPLE_PAY_CERT_PASSPHRASE:-}
  MESSENGER_TRANSPORT_DSN: amqp://${OMA_RABBITMQ_USER:-oma}:${OMA_RABBITMQ_PASSWORD:?OMA_RABBITMQ_PASSWORD is required}@rabbitmq:5672/%2f/messages
  SYLIUS_MESSENGER_TRANSPORT_MAIN_DSN: amqp://${OMA_RABBITMQ_USER:-oma}:${OMA_RABBITMQ_PASSWORD:?OMA_RABBITMQ_PASSWORD is required}@rabbitmq:5672/%2f/main
  SYLIUS_MESSENGER_TRANSPORT_MAIN_FAILED_DSN: amqp://${OMA_RABBITMQ_USER:-oma}:${OMA_RABBITMQ_PASSWORD:?OMA_RABBITMQ_PASSWORD is required}@rabbitmq:5672/%2f/main_failed
  SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_DSN: amqp://${OMA_RABBITMQ_USER:-oma}:${OMA_RABBITMQ_PASSWORD:?OMA_RABBITMQ_PASSWORD is required}@rabbitmq:5672/%2f/catalog_promotion_removal
  SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_FAILED_DSN: amqp://${OMA_RABBITMQ_USER:-oma}:${OMA_RABBITMQ_PASSWORD:?OMA_RABBITMQ_PASSWORD is required}@rabbitmq:5672/%2f/catalog_promotion_removal_failed

services:
  app:
    image: ${OMA_IMAGE:?OMA_IMAGE is required}
    restart: unless-stopped
    ports:
      - '${OMA_PORT:-40123}:80'
    mem_limit: ${OMA_APP_MEM:-2g}
    environment:
      <<: *app-env
      FRANKENPHP_CONFIG: |
        num_threads ${OMA_PHP_THREADS:-8}
    volumes:
      - media:/app/public/media
      - jwt:/app/config/jwt
      - var_log:/app/var/log
      - var_sessions:/app/var/sessions
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${OMA_IMAGE:?OMA_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${OMA_WORKER_MEM:-512m}
    command:
      - php
      - bin/console
      - messenger:consume
      - main
      - catalog_promotion_removal
      - --time-limit=3600
      - --memory-limit=256M
      - --no-interaction
    environment: *app-env
    volumes:
      - media:/app/public/media
      - jwt:/app/config/jwt
      - var_log:/app/var/log
    stop_grace_period: 30s
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    mem_limit: ${OMA_RABBITMQ_MEM:-512m}
    environment:
      RABBITMQ_DEFAULT_USER: ${OMA_RABBITMQ_USER:-oma}
      RABBITMQ_DEFAULT_PASS: ${OMA_RABBITMQ_PASSWORD:?OMA_RABBITMQ_PASSWORD is required}
    ports:
      - '127.0.0.1:${OMA_RABBITMQ_UI_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-oma.conf:/etc/rabbitmq/conf.d/10-oma.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 90s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: ${OMA_MAILPIT_MEM:-128m}
    ports:
      - '127.0.0.1:${OMA_MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 2000
      MP_SMTP_MAX_RECIPIENTS: 50
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: ${OMA_DB_MEM:-1g}
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${OMA_DB_ROOT_PASSWORD:?OMA_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: sylius_oma
      MYSQL_USER: sylius
      MYSQL_PASSWORD: ${OMA_DB_PASSWORD:?OMA_DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-oma.cnf:/etc/mysql/conf.d/oma.cnf:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${OMA_DB_ROOT_PASSWORD}',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
  rabbitmq_data:
  mailpit_data:
  media:
  jwt:
  var_log:
  var_sessions:
