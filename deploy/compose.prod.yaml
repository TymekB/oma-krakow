name: oma-prod

x-app-env: &app-env
  APP_ENV: prod
  APP_DEBUG: 0
  APP_SECRET: ${OMA_APP_SECRET:?OMA_APP_SECRET is required}
  DATABASE_URL: mysql://sylius:${OMA_DB_PASSWORD:?OMA_DB_PASSWORD is required}@mysql:3306/sylius_oma?serverVersion=8.0&charset=utf8mb4
  DEFAULT_URI: ${OMA_DEFAULT_URI:?OMA_DEFAULT_URI is required}
  TRUSTED_PROXIES: ${OMA_TRUSTED_PROXIES:-}
  MAILER_DSN: ${OMA_MAILER_DSN:-null://null}
  JWT_PASSPHRASE: ${OMA_JWT_PASSPHRASE:?OMA_JWT_PASSPHRASE is required}
  GOOGLE_CLIENT_ID: ${OMA_GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${OMA_GOOGLE_CLIENT_SECRET:-}
  STRIPE_PUBLISHABLE_KEY: ${OMA_STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_SECRET_KEY: ${OMA_STRIPE_SECRET_KEY:-}

x-app-volumes: &app-volumes
  - media:/app/public/media
  - jwt:/app/config/jwt
  - var_log:/app/var/log
  - var_sessions:/app/var/sessions

services:
  app:
    image: ${OMA_IMAGE:?OMA_IMAGE is required}
    restart: unless-stopped
    ports:
      - '${OMA_PORT:-40197}:80'
    mem_limit: ${OMA_APP_MEM:-600m}
    environment:
      <<: *app-env
      FRANKENPHP_CONFIG: ${OMA_FRANKENPHP_CONFIG:-}
    volumes: *app-volumes
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    image: ${OMA_IMAGE:?OMA_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${OMA_WORKER_MEM:-180m}
    command:
      - php
      - bin/console
      - messenger:consume
      - main
      - catalog_promotion_removal
      - --time-limit=3600
      - --memory-limit=128M
      - --no-interaction
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: ${OMA_DB_MEM:-380m}
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${OMA_DB_ROOT_PASSWORD:?OMA_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: sylius_oma
      MYSQL_USER: sylius
      MYSQL_PASSWORD: ${OMA_DB_PASSWORD:?OMA_DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-oma.cnf:/etc/mysql/conf.d/oma.cnf:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${OMA_DB_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  media:
  jwt:
  var_log:
  var_sessions:
