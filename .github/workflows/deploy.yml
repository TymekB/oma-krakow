name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Mikrus
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
      SSH_HOST: ${{ secrets.MIKRUS_HOST }}
      SSH_PORT: ${{ secrets.MIKRUS_PORT }}
      SSH_USER: ${{ secrets.MIKRUS_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MIKRUS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.MIKRUS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync stack files
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/oma-prod'
          scp -P "$SSH_PORT" deploy/compose.prod.yaml "$SSH_USER@$SSH_HOST:/opt/oma-prod/compose.yaml"
          scp -P "$SSH_PORT" deploy/mysql-oma.cnf deploy/remote-deploy.sh deploy/smoke-test.sh \
            "$SSH_USER@$SSH_HOST:/opt/oma-prod/"

      - name: Log in to registry on host
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash /opt/oma-prod/remote-deploy.sh '$IMAGE'" < /dev/null

      - name: Smoke test
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash /opt/oma-prod/smoke-test.sh' < /dev/null
