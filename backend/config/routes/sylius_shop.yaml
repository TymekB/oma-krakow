sylius_shop:
    resource: "@SyliusShopBundle/Resources/config/routing.yml"
    prefix: /sklep
    defaults:
        _locale: pl_PL

sylius_shop_product_show:
    path: /sklep/produkty/{slug}
    methods: [GET]
    defaults:
        _controller: sylius.controller.product::showAction
        _locale: pl_PL
        _sylius:
            template: '@SyliusShop/product/show.html.twig'
            repository:
                method: findOneByChannelAndSlug
                arguments:
                    - "expr:service('sylius.context.channel').getChannel()"
                    - "expr:service('sylius.context.locale').getLocaleCode()"
                    - $slug

sylius_shop_product_index:
    path: /sklep/kategorie/{slug}
    methods: [GET]
    defaults:
        _controller: sylius.controller.product::indexAction
        _locale: pl_PL
        _sylius:
            template: '@SyliusShop/product/index.html.twig'
            grid: sylius_shop_product
    requirements:
        slug: .+(?<!/)

sylius_shop_product_index_legacy_redirect:
    path: /sklep/taxons/{slug}
    methods: [GET]
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: sylius_shop_product_index
        permanent: true
        keepQueryParams: true
    requirements:
        slug: .+(?<!/)

sylius_shop_product_review_index:
    path: /sklep/produkty/{slug}/recenzje/
    methods: [GET]
    defaults:
        _controller: sylius.controller.product_review::indexAction
        _locale: pl_PL
        _sylius:
            template: '@SyliusShop/product_review/index.html.twig'
            repository:
                method: findAcceptedByProductSlugAndChannel
                arguments:
                    - $slug
                    - "expr:service('sylius.context.locale').getLocaleCode()"
                    - "expr:service('sylius.context.channel').getChannel()"

sylius_shop_product_review_create:
    path: /sklep/produkty/{slug}/recenzje/nowa
    methods: [GET, POST]
    defaults:
        _controller: sylius.controller.product_review::createAction
        _locale: pl_PL
        _sylius:
            template: '@SyliusShop/product_review/create.html.twig'
            form:
                type: Sylius\Bundle\ShopBundle\Form\Type\Product\ProductReviewType
                options:
                    validation_groups: [sylius, sylius_review]
            factory:
                method: createForSubjectWithReviewer
                arguments:
                    - "expr:notFoundOnNull(service('sylius.repository.product').findOneByChannelAndSlug(service('sylius.context.channel').getChannel(), service('sylius.context.locale').getLocaleCode(), $slug))"
                    - "expr:service('sylius.context.customer').getCustomer()"
            redirect:
                route: sylius_shop_product_show
                parameters:
                    slug: $slug
            flash: sylius.review.wait_for_the_acceptation

sylius_shop_payum:
    resource: "@SyliusPayumBundle/Resources/config/routing/integrations/sylius_shop.yaml"

sylius_payment_notify:
    resource: "@SyliusPaymentBundle/Resources/config/routing/integrations/sylius.yaml"

sylius_shop_default_locale:
    path: /
    methods: [GET]
    defaults:
        _controller: sylius_shop.controller.locale_switch::switchAction

# see https://web.dev/change-password-url/
sylius_shop_request_password_reset_token_redirect:
    path: /.well-known/change-password
    methods: [GET]
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: sylius_shop_request_password_reset_token
        permanent: false
