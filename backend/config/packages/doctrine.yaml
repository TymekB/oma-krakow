parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        use_savepoints: true
        types:
            oma_site_content_key: App\SiteContent\Infrastructure\Doctrine\Type\ContentKeyType
            oma_site_content_value: App\SiteContent\Infrastructure\Doctrine\Type\ContentValueType
            oma_site_content_author: App\SiteContent\Infrastructure\Doctrine\Type\AuthorType
            oma_site_content_snapshot: App\SiteContent\Infrastructure\Doctrine\Type\ContentSnapshotType
    orm:
        auto_generate_proxy_classes: true
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            SiteContent:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/SiteContent/Infrastructure/Doctrine/Mapping'
                prefix: 'App\SiteContent\Domain\Model'
                alias: SiteContent

when@prod: &doctrine_prod
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@test_cached: *doctrine_prod
