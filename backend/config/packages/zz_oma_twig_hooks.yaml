sylius_twig_hooks:
    hooks:
        'sylius_shop.checkout.address.content.form':
            login_hint:
                template: 'shop/checkout/login_hint.html.twig'
                priority: 250
            contact_details:
                template: 'shop/checkout/contact_details.html.twig'
                priority: 150
            guest_address_memory:
                template: 'shop/checkout/guest_address_memory.html.twig'
                priority: -250

        'sylius_shop.checkout.complete.content.form.summary.addresses':
            paypal_missing_billing_address: { enabled: false }

        'sylius.shop.product_review.index.content.main.list.review.footer':
            confirmed_by_purchase:
                template: 'shop/product_review/confirmed_by_purchase.html.twig'
                priority: -100

        'sylius_shop.product.show.content.info.summary.average_rating':
            add_review:
                template: 'shop/product_review/product_summary_add_review.html.twig'

        'sylius_shop.product.show.content.info.overview.accordion.reviews.content':
            add_review:
                template: 'shop/product_review/product_accordion_add_review.html.twig'

        'sylius.shop.product_review.index.content.main.header.buttons':
            add_review:
                template: 'shop/product_review/index_add_review.html.twig'

        'sylius_shop.account.login.content.login_container.form':
            target_path:
                template: 'shop/security/login_target_path.html.twig'
                priority: 150

        'sylius_shop.cart.index.content.form.sections.general.items.head':
            recurring: { enabled: false }
        'sylius_shop.cart.index.content.form.sections.general.items.body':
            recurring_settings: { enabled: false }
        'sylius_shop.shared.order.show.summary.table.header':
            recurring: { enabled: false }
        'sylius_shop.shared.order.show.summary.table.body':
            recurring: { enabled: false }
        'sylius_shop.product.show.content.info.summary':
            variant_recurring_settings: { enabled: false }
        'sylius_shop.account.order.show.content.main.header':
            mollie_cancel_subscription: { enabled: false }

        'sylius_shop.account.profile_update.update.content.main.form.additional_information':
            gender: { enabled: false }
        'sylius_admin.customer.create.content.form.sections.extra_information':
            gender: { enabled: false }
        'sylius_admin.customer.update.content.form.sections.extra_information':
            gender: { enabled: false }

        'sylius_admin.product.create.content.form.side_navigation':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product.create.content.form.sections':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product.update.content.form.side_navigation':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product.update.content.form.sections':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product_variant.create.content.form.side_navigation':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product_variant.create.content.form.sections':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product_variant.update.content.form.side_navigation':
            esd: { enabled: false }
            mollie: { enabled: false }
        'sylius_admin.product_variant.update.content.form.sections':
            esd: { enabled: false }
            mollie: { enabled: false }
