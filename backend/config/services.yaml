# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: pl_PL

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Model domenowy, wiadomości i DTO to nie serwisy
            - '../src/Shared/Domain/'
            - '../src/SiteContent/Domain/Model/'
            - '../src/SiteContent/Domain/ValueObject/'
            - '../src/SiteContent/Domain/Event/'
            - '../src/SiteContent/Domain/Exception/'
            - '../src/SiteContent/Application/Command/'
            - '../src/SiteContent/Application/Query/'
            - '../src/SiteContent/Application/Event/'
            - '../src/SiteContent/Application/View/'
            - '../src/SiteContent/Infrastructure/Doctrine/Type/'
            - '../src/SiteContent/UI/Http/Exception/'
            - '../src/Payment/PayU/Domain/PayUGateway.php'
            - '../src/Payment/PayU/Domain/Model/'
            - '../src/Payment/PayU/Domain/ValueObject/'
            - '../src/Payment/PayU/Domain/Event/'
            - '../src/Payment/PayU/Domain/Exception/'
            - '../src/Payment/PayU/Application/Command/'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\SiteContent\UI\Http\Controller\:
        resource: '../src/SiteContent/UI/Http/Controller'
        tags: ['controller.service_arguments']

    App\Notification\UI\Http\Controller\:
        resource: '../src/Notification/UI/Http/Controller'
        tags: ['controller.service_arguments']

    # Porty (Application/Domain) -> adaptery (Infrastructure)
    App\Shared\Application\Bus\CommandBus: '@App\Shared\Infrastructure\Bus\MessengerCommandBus'
    App\Shared\Application\Bus\QueryBus: '@App\Shared\Infrastructure\Bus\MessengerQueryBus'
    App\Shared\Application\Event\EventPublisher: '@App\Shared\Infrastructure\Event\MessengerEventPublisher'
    App\Shared\Domain\Clock: '@App\Shared\Infrastructure\Clock\SymfonyClock'

    App\SiteContent\Domain\Repository\SiteContentRepository: '@App\SiteContent\Infrastructure\Doctrine\Repository\DoctrineSiteContentRepository'
    App\SiteContent\Domain\Repository\ContentRevisionRepository: '@App\SiteContent\Infrastructure\Doctrine\Repository\DoctrineContentRevisionRepository'

    App\Payment\PayU\Domain\Port\PayUApi: '@App\Payment\PayU\Infrastructure\Http\PayUHttpClient'

    oma.payu.command_provider:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
        arguments:
            - !tagged_locator { tag: 'oma.payu.command_provider', index_by: 'action' }
        tags:
            - { name: 'sylius.payment_request.command_provider', gateway_factory: 'payu' }

    oma.payu.http_response_provider:
        class: Sylius\Bundle\PaymentBundle\Provider\ActionsHttpResponseProvider
        arguments:
            - !tagged_locator { tag: 'oma.payu.http_response_provider', index_by: 'action' }
        tags:
            - { name: 'sylius.payment_request.provider.http_response', gateway_factory: 'payu' }

    sylius.number_generator.sequential_order:
        class: Sylius\Bundle\CoreBundle\Order\NumberGenerator\SequentialOrderNumberGenerator
        arguments:
            $sequenceRepository: '@sylius.repository.order_sequence'
            $sequenceFactory: '@sylius.factory.order_sequence'
            $sequenceManager: '@sylius.manager.order_sequence'
            $numberLength: 4
