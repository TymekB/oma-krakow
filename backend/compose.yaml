name: oma-shop

x-app-env: &app-env
  APP_ENV: ${OMA_ENV:-prod}
  APP_DEBUG: ${OMA_DEBUG:-0}
  APP_RUNTIME: Runtime\FrankenPhpSymfony\Runtime
  DATABASE_URL: mysql://sylius:sylius@mysql:3306/sylius_oma?serverVersion=8.0&charset=utf8mb4
  DEFAULT_URI: ${OMA_DEFAULT_URI:-http://localhost:8080}
  MAILER_DSN: smtp://mailpit:1025
  PAYU_ENVIRONMENT: ${OMA_PAYU_ENVIRONMENT:-sandbox}
  PAYU_POS_ID: ${OMA_PAYU_POS_ID:-300746}
  PAYU_CLIENT_ID: ${OMA_PAYU_CLIENT_ID:-300746}
  PAYU_CLIENT_SECRET: ${OMA_PAYU_CLIENT_SECRET:-2ee86a66e5d97e3fadc400c9f19b065d}
  PAYU_SIGNATURE_KEY: ${OMA_PAYU_SIGNATURE_KEY:-b6ca15b0d1020e8094d9b5f8d163db54}
  APPLE_PAY_MERCHANT_ID: ${OMA_APPLE_PAY_MERCHANT_ID:-}
  APPLE_PAY_DISPLAY_NAME: ${OMA_APPLE_PAY_DISPLAY_NAME:-OMA Krakow}
  APPLE_PAY_PAYMENT_METHOD_CODE: ${OMA_APPLE_PAY_PAYMENT_METHOD_CODE:-payu_apple_pay}
  APPLE_PAY_CERT_PATH: ${OMA_APPLE_PAY_CERT_PATH:-}
  APPLE_PAY_CERT_KEY_PATH: ${OMA_APPLE_PAY_CERT_KEY_PATH:-}
  APPLE_PAY_CERT_PASSPHRASE: ${OMA_APPLE_PAY_CERT_PASSPHRASE:-}
  MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
  SYLIUS_MESSENGER_TRANSPORT_MAIN_DSN: amqp://guest:guest@rabbitmq:5672/%2f/main
  SYLIUS_MESSENGER_TRANSPORT_MAIN_FAILED_DSN: amqp://guest:guest@rabbitmq:5672/%2f/main_failed
  SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_DSN: amqp://guest:guest@rabbitmq:5672/%2f/catalog_promotion_removal
  SYLIUS_MESSENGER_TRANSPORT_CATALOG_PROMOTION_REMOVAL_FAILED_DSN: amqp://guest:guest@rabbitmq:5672/%2f/catalog_promotion_removal_failed

services:
  app:
    build:
      context: ./docker/frankenphp
    ports:
      - '8080:80'
    volumes:
      - ./:/app:cached
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - app_var:/app/var
      - composer_cache:/root/.composer/cache
      - caddy_data:/data
    environment:
      <<: *app-env
      FRANKENPHP_CONFIG: ${OMA_FRANKENPHP_CONFIG-}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./docker/frankenphp
    command:
      - php
      - bin/console
      - messenger:consume
      - main
      - catalog_promotion_removal
      - --time-limit=3600
      - --memory-limit=256M
      - --no-interaction
    volumes:
      - ./:/app:cached
      - app_var:/app/var
      - composer_cache:/root/.composer/cache
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sylius_oma
      MYSQL_USER: sylius
      MYSQL_PASSWORD: sylius
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'

volumes:
  mysql_data:
  composer_cache:
  caddy_data:
  app_var:
  rabbitmq_data:
